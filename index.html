<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Senderos BTT</title>
<meta name="description" content="Mapa de senderos BTT con sus nombres y dificultad. Elige uno y que el Karoo o el navegador del móvil te lleve hasta él.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Senderos">
<meta name="theme-color" content="#16201a">
<link rel="stylesheet" href="lib/leaflet.css">
<style>
:root{--bg:#16201a;--bg2:#1e2a22;--bg3:#29372d;--line:#33443a;--tx:#eef2ec;--tx2:#a4b0a3;--acc:#ff7a1a;--ok:#2fb35a;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#map{position:absolute;inset:0;background:#dfe3da}
button{font:inherit;color:inherit}
.fl{background:rgba(22,32,26,.94);border:1px solid var(--line);border-radius:14px;box-shadow:0 3px 14px rgba(0,0,0,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--bg3);border:1px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;font-weight:600;font-size:15px}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn:disabled{opacity:.45}
.muted{color:var(--tx2);font-size:13px}

/* barra superior */
#top{position:absolute;left:10px;right:10px;top:calc(var(--st) + 10px);z-index:1000;display:flex;gap:8px}
#search{flex:1;display:flex;align-items:center;padding:0 6px 0 12px;min-width:0}
#search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);font-size:16px;padding:12px 4px}
#search input::placeholder{color:var(--tx2)}
#search button{background:none;border:0;padding:8px;font-size:18px;cursor:pointer;color:var(--tx2)}
#layBtn{width:48px;height:48px;font-size:21px;cursor:pointer;padding:0}
#results{position:absolute;left:10px;right:68px;top:calc(var(--st) + 66px);z-index:1001;max-height:50vh;overflow:auto;display:none;padding:4px}
#results.show{display:block}
#results div{padding:10px 12px;border-radius:10px;cursor:pointer}
#results div:active,#results div:hover{background:var(--bg3)}
#results small{display:block;color:var(--tx2)}

/* estado y botones laterales */
#status{position:absolute;left:50%;top:calc(var(--st) + 68px);transform:translateX(-50%);z-index:999;padding:7px 14px;font-size:13px;display:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#status.show{display:block}
#status.busy::before{content:'';display:inline-block;width:10px;height:10px;border:2px solid var(--acc);border-right-color:transparent;border-radius:50%;margin-right:8px;vertical-align:-1px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#side{position:absolute;right:10px;bottom:calc(var(--sb) + var(--sheetH,0px) + 24px);z-index:1000;display:flex;flex-direction:column;gap:10px;transition:bottom .2s}
#side button{width:50px;height:50px;font-size:21px;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
#locBtn.on{color:#4aa3ff}
#locBtn.follow{background:#1d4f86;border-color:#4aa3ff;color:#fff}

/* ficha inferior */
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:1100;background:var(--bg2);border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.4);padding:6px 16px calc(var(--sb) + 14px);transform:translateY(105%);transition:transform .22s ease;max-height:78vh;overflow:auto}
#sheet.show{transform:none}
#sheet .grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
#sheet h2{margin:0 34px 2px 0;font-size:20px;line-height:1.25}
#sheet .x{position:absolute;right:10px;top:10px;background:var(--bg3);border:0;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg3);border-radius:20px;padding:4px 10px;font-size:13px}
.chip i{width:14px;height:5px;border-radius:3px;display:inline-block}
.dist{font-size:14px;margin:6px 0 12px}
.dist b{color:var(--acc)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts .btn{padding:14px 10px}
.sub{margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.sub a{color:var(--tx2);font-size:13px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.opts .btn{justify-content:flex-start;text-align:left;padding:13px 14px}
.opts .btn small{display:block;font-weight:400;color:var(--tx2);font-size:12px}
.opts .btn.pri small{color:#ffe3cc}
.seg{display:flex;background:var(--bg3);border-radius:12px;padding:3px;margin:6px 0 12px}
.seg button{flex:1;background:none;border:0;border-radius:9px;padding:9px 6px;font-size:13px;cursor:pointer;color:var(--tx2)}
.seg button.on{background:var(--bg);color:var(--tx);font-weight:600}
.layers{display:flex;flex-direction:column;gap:6px}
.layers label{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg3);border-radius:12px;cursor:pointer}
.layers input{accent-color:var(--acc);width:18px;height:18px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:13px;margin:8px 0}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{width:24px;height:5px;border-radius:3px;flex:none}
.prog{height:8px;background:var(--bg3);border-radius:4px;overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--tx2);margin:16px 0 8px}

/* mapa */
.trailtip{font-weight:600;font-size:12px}
.traillbl{pointer-events:none}
.traillbl span{position:absolute;transform:translate(-50%,-140%);white-space:nowrap;font:600 11px/1.2 system-ui,sans-serif;color:#1c2229;background:rgba(255,255,255,.9);border-left:3px solid;padding:1px 5px;border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.me{width:20px;height:20px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 2px rgba(26,115,232,.35),0 2px 6px rgba(0,0,0,.4)}
.entry{width:30px;height:30px;border-radius:50%;background:var(--acc);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;font-size:14px}
.leaflet-control-attribution{font-size:10px;background:rgba(255,255,255,.75)!important}
.leaflet-bottom.leaflet-left{bottom:calc(var(--sb) + var(--sheetH,0px));transition:bottom .2s}

/* avisos */
#toast{position:fixed;left:50%;bottom:calc(var(--sb) + var(--sheetH,0px) + 90px);transform:translateX(-50%) translateY(20px);z-index:2000;background:#0d130f;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.4)}
#toast.show{opacity:1;transform:translateX(-50%)}
#install{position:absolute;left:10px;right:10px;bottom:calc(var(--sb) + 14px);z-index:1050;padding:12px 14px;display:none;gap:10px;align-items:center}
#install.show{display:flex}
#install p{margin:0;flex:1;font-size:14px}
#install .x{background:none;border:0;font-size:18px;color:var(--tx2);cursor:pointer;padding:4px}
@media (min-width:700px){
  #sheet{left:12px;right:auto;width:400px;bottom:12px;border-radius:18px;border:1px solid var(--line)}
  #side{bottom:24px}
  #top{right:auto;width:420px}
  #results{right:auto;width:362px}
  #install{right:auto;width:420px}
}
</style>
</head>
<body>
<div id="map"></div>

<div id="top">
  <form id="search" class="fl" autocomplete="off">
    <input type="search" id="q" placeholder="Buscar sendero, lugar o coordenadas" enterkeyhint="search">
    <button type="submit" aria-label="Buscar">🔍</button>
  </form>
  <button id="layBtn" class="fl" aria-label="Mapas y sin cobertura">🗺️</button>
</div>
<div id="results" class="fl"></div>
<div id="status" class="fl"></div>

<div id="side">
  <button id="locBtn" class="fl" aria-label="Mi posición">⌖</button>
</div>

<div id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<div id="install" class="fl"></div>
<div id="toast"></div>

<script src="lib/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
